name: Update DocDot formula

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-docdot-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check upstream and update formula
        id: update
        run: ruby .github/scripts/update_docdot_formula.rb

      - name: Validate formula update
        if: steps.update.outputs.updated == 'true'
        run: |
          ruby -c Formula/docdot.rb
          git diff --check

      - name: Commit formula update
        if: steps.update.outputs.updated == 'true'
        env:
          DOCDOT_VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/docdot.rb
          git commit -m "chore(docdot): update to ${DOCDOT_VERSION}"
          git push
